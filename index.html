<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#CFE8EE" />
    <script>
      // Theme before first paint (no flash): an explicit choice, else the system's.
      (function () {
        var t;
        try { t = localStorage.getItem('dive-atlas-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && t === 'dark') m.setAttribute('content', '#0B1C2E');
      })();
    </script>
    <meta name="description" content="An interactive dive for engineers learning how LLM agents work by building a trip planner in plain Python." />
    <title>Agent Dive Atlas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
